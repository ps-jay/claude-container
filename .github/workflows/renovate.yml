---
name: Renovate

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "0 12 * * 4"
      timezone: "Australia/Melbourne"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: renovatebot/github-action@v46.3.15
        with:
          # Needs a PAT or GitHub App token: the default GITHUB_TOKEN cannot
          # trigger workflows or edit files under .github/workflows.
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
